<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Vibrant Waving Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7; #4f46e5; #7c3aed; #0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb; #7c3aed; #db2777; #2563eb" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed; #0284c7; #2563eb; #7c3aed" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Secondary Wave Gradient -->
    <linearGradient id="wave-back" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 21px;
      font-weight: 500;
      fill: #f1f5f9;
      opacity: 0.95;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base / Secondary Layer Wave -->
  <path d="M 0,0 L 1200,0 L 1200,195 Q 1050,235 900,190 T 600,195 T 300,185 T 0,205 Z" fill="url(#wave-back)" />

  <!-- Main Primary Waving Header Banner -->
  <path d="M 0,0 L 1200,0 L 1200,175 Q 1050,225 900,170 T 600,180 T 300,165 T 0,185 Z" fill="url(#wave-grad)" filter="url(#shadow)" />

  <!-- Main Title -->
  <text x="600" y="85" text-anchor="middle" class="title">Venkat Mohan Atmakuru</text>

  <!-- Subtitle / Description -->
  <text x="600" y="132" text-anchor="middle" class="desc">Full-Stack Developer | Python &amp; JavaScript Enthusiast</text>
</svg>
