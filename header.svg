<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      font-size: 50px;
      font-weight: 800;
      fill: url(#accent-grad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace;
      font-size: 21px;
      font-weight: 500;
      fill: url(#sub-grad);
      letter-spacing: 1px;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 0.7;
      opacity: 0.4;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Cyber Grid Background -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />

    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1050" y1="0" x2="1050" y2="320" />
  </g>

  <!-- Glowing Corner Orbs -->
  <circle cx="100" cy="50" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1100" cy="270" r="160" fill="#818cf8" opacity="0.09" filter="url(#glow)" />
  <circle cx="600" cy="160" r="220" fill="#c084fc" opacity="0.04" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-grad)" />

  <!-- Terminal Window Dots -->
  <circle cx="45" cy="35" r="7" fill="#ef4444" opacity="0.85" />
  <circle cx="68" cy="35" r="7" fill="#f59e0b" opacity="0.85" />
  <circle cx="91" cy="35" r="7" fill="#10b981" opacity="0.85" />

  <!-- Main Content Centered -->
  <!-- Hand Wave Icon / Greeting -->
  <text x="600" y="95" text-anchor="middle" font-size="28" fill="#38bdf8" opacity="0.9">👋 HELLO WORLD, I'M</text>

  <!-- Name -->
  <text x="600" y="165" text-anchor="middle" class="title" filter="url(#subtle-glow)">Venkat Mohan Atmakuru</text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" class="subtitle">Full-Stack Developer • Python &amp; JavaScript Specialist</text>

  <!-- Pill Badges at Bottom -->
  <g transform="translate(360, 245)">
    <!-- Pill 1: Location -->
    <g transform="translate(0, 0)">
      <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="70" y="22" text-anchor="middle" class="badge">📍 Bengaluru</text>
    </g>

    <!-- Pill 2: Open to Work -->
    <g transform="translate(155, 0)">
      <rect width="175" height="34" rx="17" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <circle cx="20" cy="17" r="4" fill="#34d399" />
      <text x="95" y="22" text-anchor="middle" class="badge" fill="#6ee7b7">Open to Collaborate</text>
    </g>

    <!-- Pill 3: Tech Stack -->
    <g transform="translate(345, 0)">
      <rect width="135" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="67" y="22" text-anchor="middle" class="badge">⚡ Full-Stack</text>
    </g>
  </g>

  <!-- Decorative Wave / Border Line at Bottom -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent-grad)" />
</svg>
